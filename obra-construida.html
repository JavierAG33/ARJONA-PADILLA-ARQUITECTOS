<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Obra construida | Arjona Padilla Arquitectos</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- CABECERA -->
  <header class="site-header">

    <nav class="main-nav" aria-label="Navegación principal">
      <a href="index.html">ESTUDIO</a>

      <a
        href="obra-construida.html"
        class="is-active"
        aria-current="page"
      >
        OBRA CONSTRUIDA
      </a>

      <a href="proyectos.html">PROYECTOS</a>

      <a href="blog.html">BLOG</a>
    </nav>

    <a href="index.html" class="site-name">
      Arjona Padilla Arquitectos
    </a>

  </header>


  <main>

    <!-- FILTROS DE OBRA CONSTRUIDA -->
    <section class="projects-filters-section">

      <div
        class="projects-filters"
        aria-label="Filtrar obra construida"
      >

        <button
          class="project-filter is-active"
          type="button"
          data-filter="todos"
          aria-pressed="true"
        >
          Todos
        </button>

        <button
          class="project-filter"
          type="button"
          data-filter="vivienda"
          aria-pressed="false"
        >
          Vivienda
        </button>

        <button
          class="project-filter"
          type="button"
          data-filter="educacion"
          aria-pressed="false"
        >
          Educación
        </button>

        <button
          class="project-filter"
          type="button"
          data-filter="equipamientos"
          aria-pressed="false"
        >
          Equipamientos
        </button>

        <button
          class="project-filter"
          type="button"
          data-filter="rehabilitaciones"
          aria-pressed="false"
        >
          Rehabilitaciones
        </button>

        <button
          class="project-filter"
          type="button"
          data-filter="intervenciones-efimeras"
          aria-pressed="false"
        >
          Intervenciones Efímeras
        </button>

        <button
          class="project-filter"
          type="button"
          data-filter="espacio-publico"
          aria-pressed="false"
        >
          Espacio Público
        </button>

      </div>

    </section>


    <!-- OBRAS -->
    <section class="projects-page-section">

      <div class="projects-grid">

        <!-- PROYECTO 1 -->
        <article
          class="project-card"
          data-category="vivienda"
        >
          <a href="proyectos/proyecto-01.html">

            <div class="project-card-image">
              <img
                src="images/obra-construida/proyecto-01.jpg"
                alt="Proyecto de Arjona Padilla Arquitectos"
              >
            </div>

            <h2 class="project-card-title">
              Nombre del proyecto
            </h2>

          </a>
        </article>


        <!-- PROYECTO 2 -->
        <article
          class="project-card"
          data-category="equipamientos"
        >
          <a href="proyectos/proyecto-02.html">

              <img
                src="images/obra-construida/proyecto-02.jpg"

              >
            </div>

            <h2 class="project-card-title">
              Nombre del proyecto
            </h2>

          </a>
        </article>


        <!-- PROYECTO 3 -->
        <article
          class="project-card"
          data-category="rehabilitaciones"

          <a href="proyectos/proyecto-03.html">

                src="images/obra-construida/proyecto-03.jpg"

              >
            </div>

            <h2 class="project-card-title">
              Nombre del proyecto
            </h2>

          </a>
        </article>


        <!-- PROYECTO 4 -->
        <article
          class="project-card"
          data-category="vivienda"
        >
          <a href="proyectos/proyecto-04.html">

            <div class="project-card-image">
              <img
                src="images/obra-construida/proyecto-04.jpg"

              >
            </div>

            <h2 class="project-card-title">
              Nombre del proyecto
            </h2>

          </a>
        </article>


        <!-- PROYECTO 5 -->

          data-category="espacio-publico"

          <a href="proyectos/proyecto-06.html">

            <div class="project-card-image">
              <img
                src="images/obra-construida/proyecto-06.jpg"

              >
            </div>

            <h2 class="project-card-title">
