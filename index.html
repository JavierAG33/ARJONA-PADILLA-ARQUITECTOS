<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ARJONA PADILLA ARQUITECTOS</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f3;
      color: #1a1a1a;
    }

    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      box-sizing: border-box;
    }

    h1 {
      margin: 0 0 15px;
      font-size: clamp(36px, 7vw, 80px);
      font-weight: 400;
      letter-spacing: -2px;
    }

    p {
      margin: 0;
      font-size: 18px;
      color: #666;
    }
  </style>
</head>

<body>
  <main>
    <div>
      <h1>ARJONA PADILLA ARQUITECTOS</h1>
      <p>Estudio de arquitectura</p>
    </div>
  </main>
</body>
</html>
